name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install NSIS and Wails
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build plug-and-play installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SentryMed-Opti-Windows-Installer
          path: build/bin/*-installer.exe
          if-no-files-found: error
          retention-days: 30
